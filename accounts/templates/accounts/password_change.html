{% extends "base.html" %}{% load i18n form_tags %}
{% block title %}{% translate "Change password" %}{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-12 col-md-10 col-lg-5">
  <div class="card shadow-sm"><div class="card-body p-4">
    <h1 class="h4 mb-3">{% translate "Change password" %}</h1>
    <form method="post" novalidate>{% csrf_token %}
      {% bs_form form %}
      <button class="btn btn-primary" type="submit">{% translate "Change password" %}</button>
      <a class="btn btn-link" href="{% url 'accounts:profile' %}">{% translate "Cancel" %}</a>
    </form>
  </div></div>
</div></div>
{% endblock %}
