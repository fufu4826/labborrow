{% extends "base.html" %}{% load i18n form_tags %}
{% block title %}{% translate "Edit user" %}{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-12 col-md-10 col-lg-6">
  <div class="card shadow-sm"><div class="card-body p-4">
    <h1 class="h4 mb-1">{% translate "Edit user" %}</h1>
    <p class="text-muted">{{ object.username }}</p>
    <form method="post" novalidate>{% csrf_token %}
      {% bs_form form %}
      <button class="btn btn-primary" type="submit">{% translate "Save" %}</button>
      <a class="btn btn-link" href="{% url 'accounts:user_list' %}">{% translate "Cancel" %}</a>
    </form>
  </div></div>
</div></div>
{% endblock %}
