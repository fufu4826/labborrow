{% extends "base.html" %}
{% load i18n %}
{% block title %}{% translate "Booking calendar" %}{% endblock %}
{% block content %}
<div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
  <h1 class="h3 mb-0">{% translate "Booking calendar" %}</h1>
  {% if user.is_borrower %}<a class="btn btn-primary" href="{% url 'borrowing:request_create' %}"><i class="bi bi-plus-lg"></i> {% translate "New borrow request" %}</a>{% endif %}
</div>
<div class="card card-body mb-3">
  <label class="form-label" for="equipment-filter">{% translate "Equipment" %}</label>
  <select id="equipment-filter" class="form-select">
    <option value="">{% translate "All equipment" %}</option>
    {% for eq in equipment_list %}<option value="{{ eq.pk }}" {% if selected == eq.pk|stringformat:"s" %}selected{% endif %}>{{ eq.asset_code }} {{ eq.display_name }}</option>{% endfor %}
  </select>
</div>
<div class="card card-body"><div id="calendar"></div></div>
{% endblock %}
{% block extra_js %}
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/locales-all.global.min.js"></script>
<script>
document.addEventListener("DOMContentLoaded", function () {
  var filter = document.getElementById("equipment-filter");
  var calendar = new FullCalendar.Calendar(document.getElementById("calendar"), {
    locale: "{{ LANGUAGE_CODE|default:'th' }}",
    noEventsContent: "{% translate 'No bookings in this period' %}",
    initialView: window.innerWidth < 768 ? "listWeek" : "dayGridMonth",
    height: "auto",
    headerToolbar: window.innerWidth < 768
      ? {left: "prev,next", center: "title", right: "today"}
      : {left: "prev,next today", center: "title", right: "dayGridMonth,timeGridWeek,listWeek"},
    footerToolbar: window.innerWidth < 768 ? {center: "dayGridMonth,timeGridWeek,listWeek"} : false,
    events: {url: "{% url 'borrowing:calendar_events' %}", extraParams: function () { return {equipment: filter.value}; }}
  });
  calendar.render();
  filter.addEventListener("change", function () { calendar.refetchEvents(); });
});
</script>
{% endblock %}
