# /etc/nginx/sites-available/labborrow  (ln -s to sites-enabled)
# certbot --nginx -d labborrow.example.ac.th  จะเพิ่มบล็อก 443 และ redirect ให้อัตโนมัติ
upstream labborrow_app {
    server unix:/run/labborrow/gunicorn.sock fail_timeout=0;
}

server {
    listen 80;
    listen [::]:80;
    server_name labborrow.example.ac.th;

    client_max_body_size 12m;

    location /static/ {
        alias /srv/labborrow/app/staticfiles/;
        expires 7d;
        access_log off;
    }

    location /media/ {
        alias /srv/labborrow/app/media/;
        add_header X-Content-Type-Options nosniff always;
        # ไม่รันสคริปต์ใด ๆ จากโฟลเดอร์อัปโหลด
        location ~* \.(php|py|pl|cgi|sh|html?)$ { return 403; }
    }

    location / {
        proxy_pass http://labborrow_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
